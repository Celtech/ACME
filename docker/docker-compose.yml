version: "3.8"

services:
  app:
    image: registry.chargeover.com/rykelabs/acme-server:latest
    networks:
      - acme-server
    environment:
      ACME_ENV: "development"
      DNSMADEEASY_HTTP_TIMEOUT: "60"
      DNSMADEEASY_PROPAGATION_TIMEOUT: "60"
    volumes:
      - acme-data:/data

volumes:
  acme-data:
